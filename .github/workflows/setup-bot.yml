name: Подключить бота к воркеру

# Запускается вручную: Actions → «Подключить бота к воркеру» → Run workflow.
# Делает то же, что команда curl из инструкции, но без терминала.
on:
  workflow_dispatch:

jobs:
  webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, что секреты заполнены
        env:
          TOKEN: ${{ secrets.BOT_TOKEN }}
          SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER: ${{ secrets.WORKER_URL }}
        run: |
          missing=""
          [ -z "$TOKEN" ]  && missing="$missing BOT_TOKEN"
          [ -z "$SECRET" ] && missing="$missing WEBHOOK_SECRET"
          [ -z "$WORKER" ] && missing="$missing WORKER_URL"
          if [ -n "$missing" ]; then
            echo "Не заданы секреты:$missing"
            echo "Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Прописать вебхук в Telegram
        env:
          TOKEN: ${{ secrets.BOT_TOKEN }}
          SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER: ${{ secrets.WORKER_URL }}
        run: |
          answer=$(curl -sS "https://api.telegram.org/bot$TOKEN/setWebhook" \
            --data-urlencode "url=$WORKER" \
            --data-urlencode "secret_token=$SECRET")
          # Токен в ответе не печатаем: логи Actions видны всем в публичном репозитории.
          echo "$answer" | sed "s/$TOKEN/***/g"
          echo "$answer" | grep -q '"ok":true' || exit 1
          echo "Готово. Напишите боту /start"

      - name: Показать состояние вебхука
        env:
          TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          curl -sS "https://api.telegram.org/bot$TOKEN/getWebhookInfo" \
            | sed "s/$TOKEN/***/g"
