name: Развернуть бота на Cloudflare

# Разворачивает воркер и сразу подключает его к Telegram.
# Запускается вручную и автоматически, когда меняется код бота.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bot/worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-bot.yml"

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Проверить, что секреты заданы
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$BOT_TOKEN" ] && missing="$missing BOT_TOKEN"
          if [ -n "$missing" ]; then
            echo "Не заданы секреты:$missing"
            echo "Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - name: Развернуть воркер
        run: npx --yes wrangler@3 deploy

      - name: Передать воркеру ключи
        run: |
          # Секрет вебхука выводим из токена бота: так его не нужно нигде
          # заводить руками, а по самому секрету токен восстановить нельзя.
          # Соль меняет значение — прежнее засветилось в публичном логе.
          WEBHOOK_SECRET=$(printf 'tg-webhook-v2:%s' "$BOT_TOKEN" | sha256sum | cut -c1-32)
          # Обязательно до записи в GITHUB_ENV: иначе GitHub напечатает
          # значение в заголовке следующего шага, а логи здесь публичные.
          echo "::add-mask::$WEBHOOK_SECRET"
          echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"
          printf '%s' "$BOT_TOKEN"       | npx --yes wrangler@3 secret put BOT_TOKEN
          printf '%s' "$WEBHOOK_SECRET"  | npx --yes wrangler@3 secret put WEBHOOK_SECRET

      - name: Подключить бота к Telegram
        run: |
          NAME=$(grep -m1 '^name' wrangler.toml | cut -d'"' -f2)
          SUB="${{ vars.WORKERS_SUBDOMAIN || 'kvistiso2' }}"
          URL="https://$NAME.$SUB.workers.dev"
          echo "Адрес бота: $URL"
          answer=$(curl -sS "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" \
            --data-urlencode "url=$URL" \
            --data-urlencode "secret_token=$WEBHOOK_SECRET")
          # Токен в логах не печатаем: репозиторий публичный.
          echo "$answer" | sed "s/$BOT_TOKEN/***/g"
          echo "$answer" | grep -q '"ok":true' || {
            echo "Telegram отказал. Если адрес воркера отличается от $URL,"
            echo "задайте переменную WORKERS_SUBDOMAIN в Settings → Variables."
            exit 1
          }
          echo "Готово. Напишите боту /start"
