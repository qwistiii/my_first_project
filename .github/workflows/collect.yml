name: Сбор данных о серверах

on:
  schedule:
    # Каждые 15 минут. GitHub нередко запускает расписание с задержкой,
    # поэтому бот всегда показывает фактическое время сбора, а не ожидаемое.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Один сбор за раз: параллельные запуски конфликтовали бы при коммите.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать онлайн и цены
        run: python bot/collect.py

      - name: Закоммитить, если данные изменились
        run: |
          if git diff --quiet -- data/servers.json; then
            echo "данные не изменились — коммит не нужен"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/servers.json
          git commit -m "Данные серверов: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
